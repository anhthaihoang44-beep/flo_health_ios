name: CycleCare
options:
  bundleIdPrefix: com.cyclecare
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  CycleCare:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CycleCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyclecare.app
        PRODUCT_NAME: CycleCare
        INFOPLIST_FILE: CycleCare/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies: []
  CycleCareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CycleCareTests
    dependencies:
      - target: CycleCare
